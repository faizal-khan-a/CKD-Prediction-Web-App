<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CKD Detection</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-body {
      background: url('/static/background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 35px;
      width: 320px;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .login-container h1 {
      background: linear-gradient(90deg, #ff0066, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 24px;
      margin-bottom: 20px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .input-group {
      position: relative;
      margin-bottom: 18px;
      width: 260px;
      margin-left: auto;
      margin-right: auto;
    }

    .input-group input {
      width: 100%;
      padding: 10px 35px 10px 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background-color: rgba(255,255,255,0.9);
      color: #000;
    }

    .input-group .icon {
      position: absolute;
      right: 10px;
      top: 8px;
      cursor: pointer;
      color: #555;
      transition: color 0.3s;
    }

    .input-group .icon:hover {
      color: #0078ff;
    }

    button {
      width: 70%;
      background-color: #0078ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #005fcc;
    }

    .error-msg {
      color: #ffdddd;
      background: rgba(255, 0, 0, 0.2);
      padding: 5px;
      border-radius: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-container glass">
    <h1>🔐 CKD Detection Login</h1>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
      <div class="input-group">
        <input type="text" name="username" id="username" placeholder="Username" required>
        <span class="icon" onclick="fillDemo()">👤</span>
      </div>

      <div class="input-group">
        <input type="password" name="password" id="password" placeholder="Password" required>
        <span class="icon" onclick="togglePassword()">👁️</span>
      </div>

      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    // 👁️ Toggle password visibility
    function togglePassword() {
      const passField = document.getElementById('password');
      passField.type = passField.type === 'password' ? 'text' : 'password';
    }

    // 👤 Auto-fill demo credentials
    function fillDemo() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = '0306';  // ✅ updated password
    }
  </script>
</body>
</html>
