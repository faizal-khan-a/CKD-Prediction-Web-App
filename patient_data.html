<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Data | CKD Detector</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      background: url("/static/kidney.png") no-repeat center center fixed;
      background-size: cover;
      font-family: "Poppins", sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .data-container {
      margin: 120px auto 60px;
      width: 90%;
      max-width: 950px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(15px);
      border-radius: 18px;
      padding: 30px 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #00ffe1;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: linear-gradient(90deg, #00c6ff, #00ffe1);
      color: #000;
      font-weight: bold;
    }

    tr:hover {
      background: rgba(0, 255, 255, 0.15);
    }

    td {
      color: #fff;
    }

    .download-btn {
      background: linear-gradient(90deg, #00c6ff, #00ffe1);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .download-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    .no-data {
      text-align: center;
      font-size: 18px;
      color: #ddd;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <h2>🧬 CKD Detector</h2>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/predict-page">Predict</a></li>
      <li><a href="/data" class="active">Patient Data</a></li>
      <li><a href="/settings">Settings</a></li>
      <li><a href="/logout" class="logout-btn">Logout</a></li>
    </ul>
  </nav>

  <div class="data-container">
    <h1>🩺 Patient Prediction History</h1>

    <table id="patientTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Patient Name</th>
          <th>Age</th>
          <th>Blood Pressure</th>
          <th>Prediction Result</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="patientData"></tbody>
    </table>

    <p id="noData" class="no-data" style="display:none;">No patient data available.</p>
  </div>

  <script>
    async function loadPatients() {
      try {
        const response = await fetch('/patients');
        const data = await response.json();
        const tableBody = document.getElementById('patientData');
        const noData = document.getElementById('noData');

        if (!data || data.length === 0) {
          noData.style.display = 'block';
          return;
        }

        data.forEach((p) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.age || '-'}</td>
            <td>${p.bp || '-'}</td>
            <td style="font-weight:bold; color: ${
              p.result === "CKD Detected" ? "#ff5858" : "#00ffb3"
            };">${p.result}</td>
            <td>
              <button class="download-btn" onclick="downloadPDF(${p.id})">⬇️ Download</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error('Error loading patients:', err);
        document.getElementById('noData').textContent = "⚠️ Failed to load patient data.";
        document.getElementById('noData').style.display = 'block';
      }
    }

    // ✅ PDF Download Function
    async function downloadPDF(id) {
      try {
        const response = await fetch(`/download-pdf/${id}`);
        if (!response.ok) throw new Error("Download failed");

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Patient_${id}.pdf`;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("⚠️ Failed to download PDF: " + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPatients);
  </script>
</body>
</html>
